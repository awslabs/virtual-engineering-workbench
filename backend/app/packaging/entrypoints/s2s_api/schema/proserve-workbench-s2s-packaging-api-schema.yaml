    CreateComponentResponse:
      properties:
        componentId:
          type: "string"
      required: ["componentId"]
      type: "object"
    ComponentVersionActionResponse:
      properties:
        componentVersionId:
          type: "string"
      required: ["componentVersionId"]
      type: "object"
    RecipeComponentVersion:
      type: object
      additionalProperties: false
      required: [componentId, componentName, componentVersionId, componentVersionName, componentVersionType, order]
      properties:
        componentId: {type: string, maxLength: 64}
        componentName: {type: string, maxLength: 100}
        componentVersionId: {type: string, maxLength: 64}
        componentVersionName: {type: string, maxLength: 64}
