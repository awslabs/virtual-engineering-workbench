openapi: 3.0.1
info:
  title: Virtual Engineering Workbench Packaging S2S API
  version: 1.0.0
  description: Project-scoped component, recipe, and pipeline publishing POC using internal IDs.
servers:
  - url: https://{Host}/clients/packaging/v1
    variables:
      Host:
        default: example.invalid
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
  params-only:
    validateRequestBody: false
    validateRequestParameters: true
x-amazon-apigateway-request-validator: params-only
x-amazon-apigateway-gateway-responses:
  DEFAULT_4XX: &clientGatewayError
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/problem+json'"
      gatewayresponse.header.Cache-Control: "'no-store'"
    responseTemplates:
      application/problem+json: >-
        {"type":"https://problems.virtual-engineering-workbench.dev/api-gateway-error","title":"Client Error","status":$context.status,"detail":$context.error.messageString,"code":"$context.error.responseType","requestId":"$context.requestId","retryable":false}
  BAD_REQUEST_BODY: *clientGatewayError
  BAD_REQUEST_PARAMETERS: *clientGatewayError
  UNAUTHORIZED: *clientGatewayError
  ACCESS_DENIED: *clientGatewayError
  THROTTLED: *clientGatewayError
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/problem+json'"
      gatewayresponse.header.Cache-Control: "'no-store'"
    responseTemplates:
      application/problem+json: >-
        {"type":"https://problems.virtual-engineering-workbench.dev/api-gateway-error","title":"Server Error","status":$context.status,"detail":"API Gateway could not process the request.","code":"$context.error.responseType","requestId":"$context.requestId","retryable":true}
paths:
  /projects/{projectId}/components:
    get:
      operationId: ListComponents
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': {$ref: '#/components/responses/ComponentPage'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.read]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: &lambdaIntegration
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations
        credentials: '{{apigw_invocation_role_arn}}'
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT
        responses:
          default:
            statusCode: '200'
    post:
      operationId: CreateComponent
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComponentRequest'}
      responses:
        '201': {$ref: '#/components/responses/CreateComponent'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.write]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/components/{componentId}:
    get:
      operationId: GetComponent
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200': {$ref: '#/components/responses/Component'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.read]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
    put:
      operationId: UpdateComponent
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateComponentRequest'}
      responses:
        '200': {$ref: '#/components/responses/EmptyComponentAction'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.write]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    delete:
      operationId: ArchiveComponent
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200': {$ref: '#/components/responses/EmptyComponentAction'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.write]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/components/{componentId}/versions:
    get:
      operationId: ListComponentVersions
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200': {$ref: '#/components/responses/ComponentVersionPage'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.read]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
    post:
      operationId: CreateComponentVersion
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComponentVersionRequest'}
      responses:
        '202': {$ref: '#/components/responses/ComponentVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.write]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/components/{componentId}/versions/{versionId}:
    get:
      operationId: GetComponentVersion
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
        - $ref: '#/components/parameters/ComponentVersionId'
      responses:
        '200': {$ref: '#/components/responses/ComponentVersion'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.read]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
    put:
      operationId: UpdateComponentVersion
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
        - $ref: '#/components/parameters/ComponentVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateComponentVersionRequest'}
      responses:
        '202': {$ref: '#/components/responses/ComponentVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.write]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    delete:
      operationId: RetireComponentVersion
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
        - $ref: '#/components/parameters/ComponentVersionId'
      responses:
        '202': {$ref: '#/components/responses/ComponentVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.write]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/components/{componentId}/versions/{versionId}/release:
    post:
      operationId: ReleaseComponentVersion
      tags: [ALL]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ComponentId'
        - $ref: '#/components/parameters/ComponentVersionId'
      responses:
        '200': {$ref: '#/components/responses/ComponentVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security:
        - ClientCredentials: [clients/packaging/component.release]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/recipes:
    post:
      operationId: CreateRecipe
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRecipeRequest'}
      responses:
        '201': {$ref: '#/components/responses/CreateRecipe'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.write]}]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    get:
      operationId: ListRecipes
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {$ref: '#/components/responses/RecipePage'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/recipes/{recipeId}:
    get:
      operationId: GetRecipe
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}]
      responses:
        '200': {$ref: '#/components/responses/Recipe'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
    delete:
      operationId: ArchiveRecipe
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}]
      responses:
        '200': {description: Recipe archived.}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.write]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/recipes/{recipeId}/versions:
    post:
      operationId: CreateRecipeVersion
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRecipeVersionRequest'}
      responses:
        '202': {$ref: '#/components/responses/RecipeVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.write]}]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    get:
      operationId: ListRecipeVersions
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}]
      responses:
        '200': {$ref: '#/components/responses/RecipeVersionPage'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/recipes/{recipeId}/versions/{versionId}:
    get:
      operationId: GetRecipeVersion
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/RecipeVersionId'}]
      responses:
        '200': {$ref: '#/components/responses/RecipeVersion'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
    put:
      operationId: UpdateRecipeVersion
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/RecipeVersionId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRecipeVersionRequest'}
      responses:
        '202': {$ref: '#/components/responses/RecipeVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.write]}]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    delete:
      operationId: RetireRecipeVersion
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/RecipeVersionId'}]
      responses:
        '202': {$ref: '#/components/responses/RecipeVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.write]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/recipes/{recipeId}/versions/{versionId}/release:
    post:
      operationId: ReleaseRecipeVersion
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/RecipeVersionId'}]
      responses:
        '200': {$ref: '#/components/responses/RecipeVersionAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/recipe.release]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/pipelines:
    post:
      operationId: CreatePipeline
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePipelineRequest'}
      responses:
        '202': {$ref: '#/components/responses/PipelineAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.write]}]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    get:
      operationId: ListPipelines
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {$ref: '#/components/responses/PipelinePage'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/pipelines/{pipelineId}:
    get:
      operationId: GetPipeline
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/PipelineId'}]
      responses:
        '200': {$ref: '#/components/responses/Pipeline'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
    put:
      operationId: UpdatePipeline
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/PipelineId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePipelineRequest'}
      responses:
        '202': {$ref: '#/components/responses/PipelineAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.write]}]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    delete:
      operationId: DeletePipeline
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/PipelineId'}]
      responses:
        '202': {$ref: '#/components/responses/PipelineAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.write]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/images:
    post:
      operationId: CreateImage
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateImageRequest'}
      responses:
        '202': {$ref: '#/components/responses/ImageAction'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.execute]}]
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration: *lambdaIntegration
    get:
      operationId: ListImages
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {$ref: '#/components/responses/ImagePage'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
  /projects/{projectId}/images/{imageId}:
    get:
      operationId: GetImage
      tags: [ALL]
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/ImageId'}]
      responses:
        '200': {$ref: '#/components/responses/Image'}
        default: {$ref: '#/components/responses/Problem'}
      security: [{ClientCredentials: [clients/packaging/pipeline.read]}]
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration: *lambdaIntegration
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RecipeVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ComponentId:
      name: componentId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ComponentVersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    CreateComponent:
      description: Created component identifier.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateComponentResponse'}
    Component:
      description: Component.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentResponse'}
    ComponentPage:
      description: Components.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentPage'}
    ComponentVersion:
      description: Component version status and definition when available.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentVersionResponse'}
    ComponentVersionPage:
      description: Component versions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentVersionPage'}
    ComponentVersionAction:
      description: Component-version action; poll the version resource after an asynchronous change.
      headers:
        Retry-After:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentVersionActionResponse'}
    EmptyComponentAction:
      description: Component updated or archived.
      content:
        application/json:
          schema: {type: object}
    Problem:
      description: RFC problem response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CreateRecipe:
      description: Created recipe identifier.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateRecipeResponse'}
    Recipe:
      description: Recipe.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeResponse'}
    RecipePage:
      description: Recipe page.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipePage'}
    RecipeVersion:
      description: Recipe version status.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeVersionResponse'}
    RecipeVersionPage:
      description: Recipe versions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeVersionPage'}
    RecipeVersionAction:
      description: Accepted recipe-version action; poll the version resource for status.
      headers:
        Retry-After:
          schema: {type: string}
        Cache-Control:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeVersionActionResponse'}
    PipelineAction:
      description: Accepted pipeline action.
      headers:
        Retry-After:
          schema: {type: string, default: '5'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PipelineActionResponse'}
    Pipeline:
      description: Pipeline.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PipelineResponse'}
    PipelinePage:
      description: Pipelines.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PipelinePage'}
    ImageAction:
      description: Accepted image creation action.
      headers:
        Retry-After:
          schema: {type: string, default: '5'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateImageResponse'}
    Image:
      description: Image.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ImageResponse'}
    ImagePage:
      description: Images.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ImagePage'}
  schemas:
    Component:
      properties:
        componentId:
          type: "string"
        componentDescription:
          type: "string"
        componentName:
          type: "string"
        componentSupportedArchitectures:
          items:
            type: "string"
          type: "array"
        componentPlatform:
          type: "string"
        componentSupportedOsVersions:
          items:
            type: "string"
          type: "array"
        status:
          type: "string"
        createDate:
          type: "string"
        createdBy:
          type: "string"
        lastUpdateDate:
          type: "string"
        lastUpdatedBy:
          type: "string"
      required: ["componentId","componentDescription","componentName","componentSupportedArchitectures","componentPlatform","componentSupportedOsVersions","status","createDate","createdBy","lastUpdateDate","lastUpdatedBy"]
      type: "object"
    ComponentVersionEntry:
      properties:
        componentId:
          type: "string"
        componentName:
          type: "string"
        componentVersionId:
          type: "string"
        componentVersionName:
          type: "string"
        componentVersionType:
          type: "string"
          nullable: true
        order:
          type: "integer"
          nullable: true
        position:
          type: "string"
          nullable: true
      required: ["componentId","componentName","componentVersionId","componentVersionName"]
      type: "object"
    ComponentVersion:
      properties:
        componentId:
          type: "string"
        componentVersionId:
          type: "string"
        componentVersionDescription:
          type: "string"
        componentVersionName:
          type: "string"
        componentVersionDependencies:
          items:
            $ref: "#/components/schemas/ComponentVersionEntry"
          type: "array"
          nullable: true
        associatedComponentsVersions:
          items:
            $ref: "#/components/schemas/ComponentVersionEntry"
          type: "array"
          nullable: true
        associatedRecipesVersions:
          items: {}
          type: "array"
          nullable: true
        softwareVendor:
          type: "string"
        softwareVersion:
          type: "string"
        licenseDashboard:
          type: "string"
          nullable: true
        notes:
          type: "string"
          nullable: true
        status:
          type: "string"
        createDate:
          type: "string"
        createdBy:
          type: "string"
        lastUpdateDate:
          type: "string"
        lastUpdatedBy:
          type: "string"
      required: ["componentId","componentVersionId","componentVersionDescription","componentVersionName","softwareVendor","softwareVersion","status","createDate","createdBy","lastUpdateDate","lastUpdatedBy"]
      type: "object"
    CreateComponentRequest:
      additionalProperties: false
      properties:
        componentName:
          type: "string"
        componentDescription:
          type: "string"
        componentPlatform:
          type: "string"
        componentSupportedArchitectures:
          items:
            type: "string"
          type: "array"
        componentSupportedOsVersions:
          items:
            type: "string"
          type: "array"
