# - a92be1d5-d762-484a-86d6-8cd0907ba100: False positive: KICS does not follow $ref into components.responses. Every referenced response has a body schema (test_every_response_reference_has_a_body_schema).
# - 00b78adf-b83f-419c-8ed8-c6018441dd3a: Request strings are length-bounded instead (see 8c8261c2). Fixed formats (names, recipe descriptions, cron, allowed platforms/architectures/OS versions/release types) are checked in domain value objects; free text, YAML and opaque IDs have no fixed format. Other hits are responses, headers and path parameters.
# - 8c8261c2-19a9-4ef7-ad37-b8bc7bdd4d85: Every request-body string has maxLength, enforced by the API Gateway body validator on every body operation and again by the Pydantic request models (test_every_request_body_field_is_bounded, test_body_operations_use_the_gateway_body_validator, test_request_models_enforce_the_schema_bounds). Remaining hits: response fields, Retry-After headers, path IDs.
# - 6998389e-66b2-473d-8d05-c8d71ac4d04d: Every request-body array has maxItems, enforced the same way as 8c8261c2. Remaining hits are response arrays.
# - 9f88c88d-824d-4d9a-b985-e22977046042: Request bodies set additionalProperties: false (API Gateway) and extra='forbid' (Pydantic). Remaining hits: response schemas, and ComponentVersionEntry, which is shared with responses; unknown keys in nested entries are dropped by Pydantic.
# - 6c35d2c6-09f2-4e5c-a094-e0e91327071d: Remaining hits are the two release operations, which take no body, so 415 cannot occur. Body operations document 415 (test_body_operations_use_the_gateway_body_validator).
# - 86e3702f-c868-44b2-b61d-ea5316c18110: Each operation lists explicit problem+json codes; API Gateway method responses need explicit codes (test_method_responses_use_explicit_status_codes_for_api_gateway). Gateway responses cover the rest with the same format.
# - d172a060-8569-4412-8045-3560ebd477e8: False positive: KICS treats operation tags, x-amazon-apigateway-integration responses and response header objects as objects with required fields; OpenAPI 3.0 defines none.
# - fb7d81e7-4150-48c4-b914-92fc05da6a2f: x-amazon-apigateway-* are vendor extensions (integration, authorizer, validators, gateway responses).
# - 37140f7f-724a-4c87-a536-e9cee1d61533: ClientCredentials is a Cognito user pool authorizer; API Gateway reads the per-operation scope list as the required OAuth scopes. OpenAPI expects no scopes for apiKey schemes, so KICS flags the API Gateway convention.
# - 40e1d1bf-11a9-4f63-a3a2-a8b84c602839: Not an API key: ClientCredentials is a Cognito authorizer declared the API Gateway way (type apiKey + x-amazon-apigateway-authtype cognito_user_pools); the header carries a short-lived OAuth access token over TLS.
# - 5915c20f-dffa-4cee-b5d4-f457ddc0151a: Global security default ClientCredentials: []; every operation overrides it with its own scopes.
# - 2bd608ae-8a1f-457f-b710-c237883cb313: False positive: KICS does not resolve $ref properties. Every required property is defined (test_every_required_property_is_defined).
# - 237402e2-c2f0-46c9-9cf5-286160cf7bfc: False positive: templated paths of the same shape differ by literal segments (components, recipes, pipelines, images).
# - f5b2e6af-76f5-496d-8482-8f898c5fdb4a: ComponentVersionId and RecipeVersionId are both named versionId but sit on different paths (components vs recipes) and never meet in one operation.
# checkov:skip=CKV_OPENAPI_21: Every request-body array has maxItems (test_every_request_body_field_is_bounded). The remaining arrays are response schemas: server output, and list endpoints are not capped.
openapi: 3.0.1
info:
  title: Virtual Engineering Workbench Packaging S2S API
  version: 1.0.0
  description: Project-scoped component, recipe, and pipeline publishing POC using internal IDs.
servers:
  - url: https://{Host}/clients/packaging/v1
    variables:
      Host:
        default: example.invalid
security:
  - ClientCredentials: []
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
  params-only:
    validateRequestBody: false
    validateRequestParameters: true
x-amazon-apigateway-request-validator: params-only
x-amazon-apigateway-gateway-responses:
  DEFAULT_4XX: &clientGatewayError
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/problem+json'"
      gatewayresponse.header.Cache-Control: "'no-store'"
    responseTemplates:
      application/problem+json: >-
        {"type":"https://problems.virtual-engineering-workbench.dev/api-gateway-error","title":"Client Error","status":$context.status,"detail":$context.error.messageString,"code":"$context.error.responseType","requestId":"$context.requestId","retryable":false}
  BAD_REQUEST_BODY: *clientGatewayError
  BAD_REQUEST_PARAMETERS: *clientGatewayError
  UNAUTHORIZED: *clientGatewayError
  ACCESS_DENIED: *clientGatewayError
  THROTTLED: *clientGatewayError
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/problem+json'"
      gatewayresponse.header.Cache-Control: "'no-store'"
    responseTemplates:
      application/problem+json: >-
        {"type":"https://problems.virtual-engineering-workbench.dev/api-gateway-error","title":"Server Error","status":$context.status,"detail":"API Gateway could not process the request.","code":"$context.error.responseType","requestId":"$context.requestId","retryable":true}
