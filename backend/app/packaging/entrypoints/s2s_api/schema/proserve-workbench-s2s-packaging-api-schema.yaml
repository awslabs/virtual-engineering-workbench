components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RecipeVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ComponentId:
      name: componentId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ComponentVersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    CreateComponent:
      description: Created component identifier.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateComponentResponse'}
    Component:
      description: Component.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentResponse'}
    ComponentPage:
      description: Components.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentPage'}
    ComponentVersion:
      description: Component version status and definition when available.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentVersionResponse'}
    ComponentVersionPage:
      description: Component versions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentVersionPage'}
    ComponentVersionAction:
      description: Component-version action; poll the version resource after an asynchronous change.
      headers:
        Retry-After:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentVersionActionResponse'}
    EmptyComponentAction:
      description: Component updated or archived.
      content:
        application/json:
          schema: {type: object, additionalProperties: false}
    EmptyRecipeAction:
      description: Recipe archived.
      content:
        application/json:
          schema: {type: object, additionalProperties: false}
    Problem:
      description: RFC problem response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CreateRecipe:
      description: Created recipe identifier.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateRecipeResponse'}
    Recipe:
      description: Recipe.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeResponse'}
    RecipePage:
      description: Recipe page.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipePage'}
    RecipeVersion:
      description: Recipe version status.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeVersionResponse'}
    RecipeVersionPage:
      description: Recipe versions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeVersionPage'}
    RecipeVersionAction:
      description: Accepted recipe-version action; poll the version resource for status.
      headers:
        Retry-After:
          schema: {type: string}
        Cache-Control:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipeVersionActionResponse'}
    PipelineAction:
      description: Accepted pipeline action.
      headers:
        Retry-After:
          schema: {type: string, default: '5'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PipelineActionResponse'}
    Pipeline:
      description: Pipeline.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PipelineResponse'}
    PipelinePage:
      description: Pipelines.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PipelinePage'}
    ImageAction:
      description: Accepted image creation action.
      headers:
        Retry-After:
          schema: {type: string, default: '5'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateImageResponse'}
    Image:
      description: Image.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ImageResponse'}
    ImagePage:
      description: Images.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ImagePage'}
  schemas:
    Component:
      properties:
        componentId:
          type: "string"
        componentDescription:
          type: "string"
        componentName:
          type: "string"
        componentSupportedArchitectures:
          items:
            type: "string"
          type: "array"
        componentPlatform:
          type: "string"
        componentSupportedOsVersions:
          items:
            type: "string"
          type: "array"
        status:
          type: "string"
        createDate:
          type: "string"
        createdBy:
          type: "string"
        lastUpdateDate:
          type: "string"
        lastUpdatedBy:
          type: "string"
      required: ["componentId","componentDescription","componentName","componentSupportedArchitectures","componentPlatform","componentSupportedOsVersions","status","createDate","createdBy","lastUpdateDate","lastUpdatedBy"]
      type: "object"
    ComponentVersionEntry:
      properties:
        componentId:
          type: "string"
          maxLength: 64
        componentName:
          type: "string"
          maxLength: 100
        componentVersionId:
          type: "string"
          maxLength: 64
        componentVersionName:
          type: "string"
          maxLength: 64
        componentVersionType:
          type: "string"
          maxLength: 64
          nullable: true
        order:
          type: "integer"
          format: int32
          minimum: 0
          maximum: 10000
          nullable: true
        position:
          type: "string"
          maxLength: 64
          nullable: true
      required: ["componentId","componentName","componentVersionId","componentVersionName"]
      type: "object"
    ComponentVersion:
      properties:
        componentId:
          type: "string"
        componentVersionId:
          type: "string"
        componentVersionDescription:
          type: "string"
        componentVersionName:
          type: "string"
        componentVersionDependencies:
          items:
            $ref: "#/components/schemas/ComponentVersionEntry"
          type: "array"
          nullable: true
        associatedComponentsVersions:
          items:
            $ref: "#/components/schemas/ComponentVersionEntry"
          type: "array"
          nullable: true
        associatedRecipesVersions:
          items: {type: object}
          type: "array"
          nullable: true
        softwareVendor:
          type: "string"
        softwareVersion:
          type: "string"
        licenseDashboard:
          type: "string"
          nullable: true
        notes:
          type: "string"
          nullable: true
        status:
          type: "string"
        createDate:
          type: "string"
        createdBy:
          type: "string"
        lastUpdateDate:
          type: "string"
        lastUpdatedBy:
          type: "string"
      required: ["componentId","componentVersionId","componentVersionDescription","componentVersionName","softwareVendor","softwareVersion","status","createDate","createdBy","lastUpdateDate","lastUpdatedBy"]
      type: "object"
    CreateComponentRequest:
      additionalProperties: false
      properties:
        componentName:
          type: "string"
          maxLength: 100
        componentDescription:
          type: "string"
          maxLength: 1024
        componentPlatform:
          type: "string"
          maxLength: 64
        componentSupportedArchitectures:
          items:
            type: "string"
            maxLength: 64
          type: "array"
          maxItems: 20
        componentSupportedOsVersions:
          items:
            type: "string"
            maxLength: 64
          type: "array"
          maxItems: 50
      required: ["componentName","componentDescription","componentPlatform","componentSupportedArchitectures","componentSupportedOsVersions"]
      type: "object"
    UpdateComponentRequest:
      additionalProperties: false
      properties:
        componentDescription:
          type: "string"
          maxLength: 1024
      required: ["componentDescription"]
      type: "object"
    CreateComponentVersionRequest:
      additionalProperties: false
      properties:
        componentVersionDescription:
          type: "string"
          maxLength: 1024
        componentVersionDependencies:
          items:
            $ref: "#/components/schemas/ComponentVersionEntry"
          type: "array"
          maxItems: 100
          nullable: true
        componentVersionReleaseType:
          type: "string"
          maxLength: 64
        componentVersionYamlDefinition:
          type: "string"
          maxLength: 131072
        softwareVendor:
          type: "string"
          maxLength: 256
        softwareVersion:
          type: "string"
          maxLength: 256
        licenseDashboard:
          type: "string"
          maxLength: 2048
          nullable: true
        notes:
          type: "string"
          maxLength: 4096
          nullable: true
      required: ["componentVersionDescription","componentVersionReleaseType","componentVersionYamlDefinition","softwareVendor","softwareVersion"]
      type: "object"
    UpdateComponentVersionRequest:
      additionalProperties: false
      properties:
        componentVersionDescription:
          type: "string"
          maxLength: 1024
        componentVersionDependencies:
          items:
            $ref: "#/components/schemas/ComponentVersionEntry"
          type: "array"
          maxItems: 100
          nullable: true
        componentVersionYamlDefinition:
          type: "string"
          maxLength: 131072
        softwareVendor:
          type: "string"
          maxLength: 256
        softwareVersion:
          type: "string"
          maxLength: 256
        licenseDashboard:
          type: "string"
          maxLength: 2048
          nullable: true
        notes:
          type: "string"
          maxLength: 4096
          nullable: true
      required: ["componentVersionDescription","componentVersionYamlDefinition","softwareVendor","softwareVersion"]
      type: "object"
    ComponentResponse:
      properties:
        component:
          $ref: "#/components/schemas/Component"
      required: ["component"]
      type: "object"
    ComponentPage:
      properties:
        components:
          items:
            $ref: "#/components/schemas/Component"
          type: "array"
      required: ["components"]
      type: "object"
    ComponentVersionResponse:
      properties:
