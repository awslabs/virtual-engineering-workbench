  /projects/{projectId}/marketplace/offers/{offerId}/quotes:
    post:
      summary: "Create an AWS Marketplace quote for an AMI offer"
      description: >-
        Step 1 of 2 of a Marketplace purchase. Calls AWS Marketplace CreateAgreementRequest for the
        offer with the requestedTerms (term ids from GetMarketplaceOffer) and returns a short-lived
        agreementRequestId plus the estimated total before and after tax (null for usage-based
        pricing). Creates an agreement request in AWS Marketplace for the VEW hub account but does
        not bill or subscribe anything; only AcceptMarketplaceQuote commits the account. Rejected
        when the offer is not a single-product AMI offer or the account already has an active
        agreement for it. clientToken (optional) makes retries safe: the same token with the same
        terms returns the same agreementRequestId; without one, a token is derived from project,
        offer and terms. Requires the project admin role.
