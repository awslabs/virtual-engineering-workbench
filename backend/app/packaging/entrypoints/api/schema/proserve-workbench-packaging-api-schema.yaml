  /projects/{projectId}/marketplace/purchase-options:
    get:
      summary: "List private AWS Marketplace AMI offers extended to the account"
      description: >-
        Read-only. Lists the private AWS Marketplace offers that sellers have extended to the VEW
        hub AWS account, limited to AMI products; Container, SaaS and other product types are
        excluded. The result is account-wide: projectId is required in the path but does not filter
        it. Each item carries the offerId to pass to GetMarketplaceOffer and CreateMarketplaceQuote;
        bundle offers are marked partOfOfferSet and cannot be bought. To browse the public catalog
        use SearchMarketplaceListings; to see subscriptions the account already holds use
        ListMarketplaceAgreements. Requires the project admin role.
      operationId: ListMarketplacePurchaseOptions
      parameters:
        - name: Authorization
