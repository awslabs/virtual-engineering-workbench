info:
  title: "Workbench Packaging API"
  x-summary: "AMI Factory \u2014 component, recipe, and image build management"
  description: >-
    AMI Factory pipeline: software components (building blocks), recipes (component build
    configurations), and images (built AMIs) via EC2 Image Builder. Depends on Projects BC for
    project scope; upstream to Publishing BC (built images become publishable products); pipelines
    run scheduled image builds.
  version: "2023-10-31T12:00:00Z"
