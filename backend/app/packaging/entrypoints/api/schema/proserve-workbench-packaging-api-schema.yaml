  /projects/{projectId}/components:
    get:
      summary: "List all components in a project"
      description: >-
        Retrieves all software components (building blocks for AMI recipes) within a project scope.
        Components are reusable packages that can be shared across projects and combined into
        recipes for image building.
      operationId: GetComponents
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetComponentsResponse"
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_match
        cacheKeyParameters:
          - method.request.header.Authorization
          - method.request.path.projectId
        contentHandling: CONVERT_TO_TEXT
        credentials: "{{apigw_invocation_role_arn}}"
    post:
      summary: "Create a new software component"
      description: >-
        Registers a new component (software package) in the AMI Factory for a given project. Specify
        platform, supported architectures, and OS versions. After creation, add versions via the
        component versions endpoint. **`componentDescription` must be exactly one sentence** — a
        single short sentence stating what the component does. Do not send multiple sentences,
        bullet lists, changelogs, or installation details. **Possible values:** -
        `componentPlatform`: `Linux`, `Windows` - `componentSupportedArchitectures`: `amd64`,
        `arm64` - `componentSupportedOsVersions`: `Ubuntu 20`, `Ubuntu 22`, `Ubuntu 24`, `Microsoft
        Windows Server 2019`, `Microsoft Windows Server 2022`, `Microsoft Windows Server 2025`
      operationId: CreateComponent
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentRequest"
        required: true
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateComponentResponse"
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT
        credentials: "{{apigw_invocation_role_arn}}"
    options:
      description: CORS
      operationId: ComponentsCors
      parameters:
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
      security: []
      x-amazon-apigateway-integration:
        type: mock
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,x-amz-security-token,Cache-Control'"
              method.response.header.Access-Control-Allow-Origin: "{{cors_origin}}"
        requestTemplates:
          application/json: '{"statusCode": 200}'
        passthroughBehavior: when_no_match
  /projects/{projectId}/components/{componentId}:
    delete:
      summary: "Archive a component"
      description: >-
        Archives a component, removing it from active use within the project. Archived components
        can no longer have new versions created. Existing released versions remain available in
        recipes that already reference them.
      operationId: ArchiveComponent
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          description: Unique identifier of the software component within the project.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Empty"
        required: false
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveComponentResponse"
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT
        credentials: "{{apigw_invocation_role_arn}}"
    get:
      summary: "Get component details"
      description: >-
        Retrieves a component's configuration and its project association metadata, including which
        projects it is shared with.
      operationId: GetComponent
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          description: Unique identifier of the software component within the project.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetComponentResponse"
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_match
        cacheKeyParameters:
          - method.request.header.Authorization
          - method.request.path.projectId
          - method.request.path.componentId
        contentHandling: CONVERT_TO_TEXT
        credentials: "{{apigw_invocation_role_arn}}"
    post:
      summary: "Share a component with other projects"
      description: >-
        Grants access to an existing component for one or more target projects. Shared components
        and their released versions become available for use in recipes within those projects.
      operationId: ShareComponent
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          description: Unique identifier of the software component within the project.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareComponentRequest"
        required: true
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareComponentResponse"
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT
        credentials: "{{apigw_invocation_role_arn}}"
    put:
      summary: "Update a component's description"
      description: >-
        Modifies the description of an existing component. Does not affect existing component
        versions or recipes that reference them.
      operationId: UpdateComponent
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          description: Unique identifier of the software component within the project.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentRequest"
        required: true
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateComponentResponse"
      x-amazon-apigateway-request-validator: all
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT
        credentials: "{{apigw_invocation_role_arn}}"
    options:
      description: CORS
      operationId: ComponentCors
      parameters:
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          description: Unique identifier of the software component within the project.
          required: true
          schema:
            type: string
