  /projects/{projectId}/marketplace/listings:
    get:
      summary: "Search the public AWS Marketplace catalog for AMI listings"
      description: >-
        Read-only. Searches the public AWS Marketplace catalog, restricted server-side to
        single-product AMI listings. Optional filters: searchText, and category, pricingModel,
        publisher and rating values from GetMarketplaceFacets. Paginate with nextToken and
        maxResults (default 25). Returns listing summaries whose listingId is passed to
        GetMarketplaceListing. Does not return private offers (use ListMarketplacePurchaseOptions)
        or existing subscriptions (use ListMarketplaceAgreements). projectId is required in the path
        but does not filter results.
      operationId: SearchMarketplaceListings
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: searchText
          in: query
          description: Free-text search over the names and descriptions of AMI listings.
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Category value from GetMarketplaceFacets; repeat the parameter to match any of several.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: pricingModel
          in: query
          description: Pricing model value from GetMarketplaceFacets, for example FREE or USAGE; repeatable.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: publisher
          in: query
          description: Publisher (seller profile ID) value from GetMarketplaceFacets; repeatable.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: rating
          in: query
          description: Average customer rating value from GetMarketplaceFacets, for example 4.0; repeatable.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: nextToken
          in: query
          description: Pagination token from the nextToken of the previous page of results.
          required: false
          schema:
            type: string
        - name: maxResults
          in: query
          description: Number of listings per page, from 1 to 100; defaults to 25.
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
