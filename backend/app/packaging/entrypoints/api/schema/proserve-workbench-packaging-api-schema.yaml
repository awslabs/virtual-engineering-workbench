  /marketplace/agreements/{agreementId}:
    delete:
      summary: "Cancel an active AWS Marketplace agreement for the account"
      description: >-
        Destructive. Calls AWS Marketplace CancelAgreement on an agreementId from
        ListMarketplaceAgreements, ending the subscription for the whole VEW hub AWS account and
        every project that relies on it. This API cannot undo the cancellation; re-subscribing needs
        a new quote and acceptance. AWS refuses agreements that are not eligible for cancellation.
        Repeating the call on an agreement that is already cancelled returns success. Call it only
        with explicit confirmation from a person. Requires the caller to be an admin of at least one
        project.
      operationId: CancelMarketplaceAgreement
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: agreementId
          in: path
