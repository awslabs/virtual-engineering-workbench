components:
  schemas:
    ArchiveRecipeResponse:
      title: ArchiveRecipeResponse
      type: object
    ArchiveComponentResponse:
      title: ArchiveComponentResponse
      type: object
    Recipe:
      title: Recipe
      type: object
      required:
        - recipeId
        - recipeDescription
        - recipeName
        - recipePlatform
        - recipeArchitecture
        - recipeOsVersion
        - status
        - createDate
        - createdBy
        - lastUpdateDate
        - lastUpdatedBy
      properties:
        recipeId:
          title: RecipeId
          type: string
          description: Recipe ID
        recipeDescription:
          title: RecipeDescription
          type: string
          description: Recipe Description
        recipeName:
          title: RecipeName
          type: string
          description: Recipe Name
        recipePlatform:
          title: RecipePlatform
          type: string
          description: Recipe Platform
        recipeArchitecture:
          title: RecipeArchitecture
          type: string
          description: Operating system architecture of the recipe
        recipeOsVersion:
          title: RecipeOsVersion
          type: string
          description: Recipe OS Version
        status:
          title: Status
          type: string
          description: Status of the Recipe (CREATED/ARCHIVED)
        createDate:
          title: CreateDate
          type: string
          description: Create Date
        createdBy:
          title: CreatedBy
          type: string
          description: Created By
        lastUpdateDate:
          title: LastUpdateDate
          type: string
          description: Last Update Date
        lastUpdatedBy:
          title: LastUpdatedBy
          type: string
          description: Last Update By
    CreateRecipeRequest:
      title: CreateRecipeRequest
      type: object
      required:
        - recipeDescription
        - recipeName
        - recipePlatform
        - recipeArchitecture
        - recipeOsVersion
      properties:
        recipeDescription:
          title: RecipeDescription
          type: string
          description: Recipe Description
        recipeName:
          title: RecipeName
          type: string
          description: Recipe Name
        recipePlatform:
          title: RecipePlatform
          type: string
          description: Recipe Platform
        recipeArchitecture:
          title: RecipeArchitecture
          type: string
          description: Operating system architecture
        recipeOsVersion:
          title: RecipeOsVersion
          type: string
          description: Recipe OS Version
        createDate:
          title: CreateDate
          type: string
          description: Create Date
        createdBy:
          title: CreatedBy
          type: string
          description: Created By
        lastUpdateDate:
          title: LastUpdateDate
          type: string
          description: Last Update Date
        lastUpdatedBy:
          title: LastUpdatedBy
          type: string
          description: Last Update By
    CreateRecipeResponse:
      title: CreateRecipeResponse
      type: object
    GetRecipeResponse:
      title: GetRecipeResponse
      type: object
      required:
        - recipe
      properties:
        recipe:
          title: Recipe
          $ref: "#/components/schemas/Recipe"
    GetRecipesResponse:
      title: GetRecipesResponse
      type: object
      required:
        - recipes
      properties:
        recipes:
          title: Recipes
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
    RecipeVersion:
      title: RecipeVersion
      type: object
      required:
        - recipeId
        - recipeVersionId
        - recipeComponentsVersions
        - recipeVersionDescription
        - recipeVersionName
        - recipeVersionVolumeSize
        - status
        - createDate
        - lastUpdateDate
        - createdBy
        - lastUpdatedBy
      properties:
        recipeId:
          title: RecipeId
          type: string
          description: Recipe ID
        recipeVersionId:
          title: RecipeVersionId
          type: string
          description: Recipe Version ID
        recipeComponentsVersions:
          title: RecipeComponentsVersions
          type: array
          items:
            $ref: "#/components/schemas/RecipeComponentVersion"
          description: List of component versions that are part of this recipe
        recipeVersionDescription:
          title: RecipeVersionDescription
          type: string
          description: Recipe Version Description
        recipeVersionName:
          title: RecipeVersionName
          type: string
          description: Recipe Version Name
        recipeVersionVolumeSize:
          title: RecipeVersionVolumeSize
          type: string
          description: Size (in GB) of the recipe version root volume
        recipeVersionIntegrations:
          title: RecipeVersionIntegrations
          type: array
          items:
            type: string
          description: List of the selected integrations for the recipe version
        status:
          title: Status
          type: string
          description: Status of the Recipe Version (CREATING/CREATED/TESTING/VALIDATED/UPDATING/RELEASED/RETIRED/FAILED)
        createDate:
          title: CreateDate
          type: string
          description: Create Date
        createdBy:
          title: CreatedBy
          type: string
          description: Created By
        lastUpdateDate:
          title: LastUpdateDate
          type: string
          description: Last Update Date
        lastUpdatedBy:
          title: LastUpdatedBy
          type: string
          description: Last Update By
        parentImageProductId:
          title: ParentImageProductId
          type: string
          description: AWS Marketplace AMI product the recipe version builds on, if any
        parentImageId:
          title: ParentImageId
          type: string
          description: Imported AWS-published image the recipe version builds on, if any
    CreateRecipeVersionRequest:
      title: CreateRecipeVersionRequest
      type: object
      required:
        - recipeComponentsVersions
        - recipeVersionDescription
        - recipeVersionReleaseType
        - recipeVersionVolumeSize
      properties:
        recipeComponentsVersions:
          title: RecipeComponentsVersions
          type: array
          items:
            $ref: "#/components/schemas/RecipeComponentVersion"
          description: List of component versions that are part of this recipe
        recipeVersionDescription:
          title: RecipeVersionDescription
          type: string
          description: Recipe Version Description
        recipeVersionReleaseType:
          title: RecipeVersionReleaseType
          type: string
          description: The release type of the new recipe version
        recipeVersionVolumeSize:
          title: RecipeVersionVolumeSize
          type: string
          description: Size (in GB) of the recipe version root volume
        recipeVersionIntegrations:
          title: RecipeVersionIntegrations
          description: A list of enabled integrations
          type: array
          items:
            type: string
        parentImageProductId:
          title: ParentImageProductId
          type: string
          maxLength: 64
          pattern: ^(prod-[a-z0-9]+|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
          description: AWS Marketplace AMI product to build on instead of the platform default parent image
        parentImageId:
          title: ParentImageId
          type: string
          maxLength: 64
          pattern: ^image-[a-z0-9]+$
          description: Imported AWS-published image (AWS_PUBLISHED_AMI) to build on, instead of a Marketplace product
    CreateRecipeVersionResponse:
      title: CreateRecipeVersionResponse
      type: object
    RecipeComponentVersion:
      title: RecipeVersion
      type: object
      required:
        - componentId
        - componentName
        - componentVersionId
        - componentVersionName
        - componentVersionType
        - order
      properties:
