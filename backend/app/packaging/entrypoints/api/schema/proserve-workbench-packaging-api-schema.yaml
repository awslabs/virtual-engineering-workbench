              method.response.header.Access-Control-Allow-Origin: "{{cors_origin}}"
        requestTemplates:
          application/json: '{"statusCode": 200}'
        passthroughBehavior: when_no_match
  /projects/{projectId}/components/{componentId}/versions:
    get:
      summary: "List versions of a component"
      description: >-
        Retrieves all versions for a specific component. Each version contains a YAML definition
        that defines the installation steps deployed to EC2 Image Builder.
      operationId: GetComponentVersions
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          description: Unique identifier of the software component within the project.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetComponentVersionsResponse"
      x-amazon-apigateway-request-validator: params-only
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/{{handler_arn}}/invocations"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_match
        cacheKeyParameters:
          - method.request.header.Authorization
          - method.request.path.projectId
          - method.request.path.componentId
        contentHandling: CONVERT_TO_TEXT
        credentials: "{{apigw_invocation_role_arn}}"
    post:
      summary: "Create a new component version"
      description: >-
        Creates a new version of a component with a YAML definition, software metadata, and optional
        dependencies on other component versions. The version is deployed to EC2 Image Builder and
        enters a testing state. Once validated, it can be released. **`componentVersionDescription`
        and `notes` must each be exactly one sentence** — a single short sentence stating what
        changed in this version, and a single short sentence of extra context about the packaged
        software. Do not send multiple sentences, bullet lists, or changelogs in either field.
        Component definitions are NOT base64 encoded. A definition can reference files uploaded as
        **component assets** (see the component-asset endpoints, e.g. GetComponentAssets /
        InitiateComponentAssetUpload) by their `s3Uri` to download them during the build. **If
        validation fails:** Use PUT
        /projects/{projectId}/components/{componentId}/versions/{versionId} to update the existing
        version instead of creating a new one. The version will be re-tested automatically.
        **Build-time secrets** (license keys, tokens, credentials) the definition needs are not
        passed here — store them as SSM SecureString parameters at
        `/proserve/wb/packaging/{environment}/components/{component_id}`; EC2 Image Builder reads
        them at build time.
      operationId: CreateComponentVersion
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Unique identifier of the project that scopes this operation.
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          description: Unique identifier of the software component within the project.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentVersionRequest"
        required: true
      responses:
        "201":
          description: 201 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateComponentVersionResponse"
