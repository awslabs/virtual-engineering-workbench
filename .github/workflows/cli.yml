name: CLI (fmt, clippy, test, audit)
# Rust CLI validation. Runs on pushes/PRs that touch cli/** (or this workflow file).
# Standalone workflow file to keep CLI failures decoupled from backend/frontend jobs,
# and to skip work on PRs that don't touch cli/**.
# Supply-chain hardening: minimal token permissions; actions pinned by commit SHA.
on:
  push:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    name: CLI (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: cli
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --release --locked -- -D warnings
      - name: Unit + integration tests
        # log-capture compiles the debug_log! in-memory buffer so the redaction
        # tests in cli/tests/ can assert that no secret is logged. Without the
        # feature those tests compile to nothing and silently pass.
        run: cargo test --release --locked --features log-capture
      - name: Dependency vulnerability audit
        # Reads .cargo/audit.toml for two exemptions, each justified in that
        # file: RUSTSEC-2023-0071 (Marvin Attack) and RUSTSEC-2026-0387
        # (crypto-bigint timing) — both public-key verify only, and the second
        # on a code path this CLI never executes.
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo audit
