name: CI

# No-secrets PR validation running on the CodeBuild-hosted runner (project: vew-ci).
# Backend: install + static checks (black/isort/flake8/mypy/secret scans) + pytest.
# Frontend: install + lint + unit tests + build (with a placeholder aws-exports).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: codebuild-vew-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # setup-python has no Amazon Linux 2 (arm64) build — let uv provide Python
      # via its OS-agnostic standalone builds (same approach as local dev).
      - name: Provision Python 3.13 (via uv)
        run: uv python install 3.13

      - name: Set up Java (Corretto 21, for DynamoDB Local)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Static checks (black, isort, flake8, mypy, secret scans)
        # Skip the frontend lint hooks here — they run in the frontend job.
        run: SKIP=frontend-web-lint,frontend-infra-lint uvx pre-commit run --all-files --show-diff-on-failure

      - name: Security scan (bandit — fail on medium+ severity)
        working-directory: backend
        run: uv run bandit -r app --ini bandit.ini -ll -q

      - name: Dependency vulnerability audit (pip-audit)
        working-directory: backend
        run: uvx pip-audit -r requirements.txt --no-deps

      - name: Unit tests
        working-directory: backend
        run: uv run pytest app -n auto -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: codebuild-vew-ci-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Yarn 4 (corepack)
        run: corepack enable

      - name: Install
        working-directory: frontend/web
        run: yarn install --immutable

      - name: Dependency vulnerability audit (high+)
        working-directory: frontend/web
        run: yarn npm audit --severity high

      - name: Generate placeholder aws-exports (offline build)
        working-directory: frontend/web
        run: node scripts/gen-stub-aws-exports.mjs

      - name: Lint
        working-directory: frontend/web
        run: yarn lint

      - name: Unit tests
        working-directory: frontend/web
        run: yarn test:ci

      - name: Build
        working-directory: frontend/web
        run: yarn build
