# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# scripts/check-dependency-coverage.py fails CI when a tracked manifest has no
# entry here or an entry drops one of these settings.

version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/backend/app/shared"
      - "/backend/app/*/libraries"
      - "/backend/infra/constructs/eventbridge/eb_upsert_handler"
      - "/backend/infra/constructs/ssm/handler"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      uv-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
        group-by: "dependency-name"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directories:
      - "/frontend/web"
      - "/frontend/infrastructure"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
        group-by: "dependency-name"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      cargo-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  # Docker, GitHub Actions and pre-commit support no semver-major-days, so
  # their majors wait only the default cooldown.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend/infra/backend/resources/projects_app_stack/usecase_cdk_app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
    ignore:
      # Each image's Python must match the runtime it builds for; bump them by hand.
      - dependency-name: "docker/library/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    groups:
      pre-commit-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
