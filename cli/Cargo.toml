[package]
name = "vew"
version = "1.2.0"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls-vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
open = "5"
jsonwebtoken = { version = "10.4", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }
dirs = "5"
rayon = "1.10"
socket2 = "0.5"

[features]
# Compiles the debug_log! in-memory capture so the tests in cli/tests/ can assert
# that no secret is logged. Off in a release build.
log-capture = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
rsa = { version = "0.9", features = ["pkcs5"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
